<!-- 3B sürüm (three.js). Veri şifreli (veri.sifreli.json); parola girilince çözülür, bu dosya sadece çiziyor. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --gece:#04060f; --yazi:#e8ecff; --soluk:#8f9bc7; --altin:#f4c86a;
    --bekleyen:#8fa2ff; --kart:rgba(14,20,48,.88);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--gece);color:var(--yazi);font-family:"DM Sans",system-ui,sans-serif}
  #sahne{position:fixed;inset:0}
  #sahne canvas{display:block}
  #etiketler{position:fixed;inset:0;pointer-events:none}

  header{position:fixed;top:0;left:0;right:0;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;
    padding:18px 22px 30px;background:linear-gradient(to bottom, rgba(4,6,15,.85), rgba(4,6,15,0));pointer-events:none;z-index:3}
  header *{pointer-events:auto}
  h1{font-family:Fraunces,serif;font-weight:300;font-size:clamp(28px,4vw,46px);margin:0;letter-spacing:.5px;text-shadow:0 0 24px rgba(244,200,106,.25)}
  h1 b{font-weight:600;color:var(--altin)}
  .alt{color:var(--soluk);font-size:14px;margin-top:4px}
  nav{display:flex;flex-wrap:wrap;gap:6px}
  nav button{font:inherit;font-size:13px;color:var(--yazi);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);
    padding:7px 12px;border-radius:999px;cursor:pointer;transition:.2s;backdrop-filter:blur(6px)}
  nav button:hover{background:rgba(255,255,255,.12)}
  nav button.secili{background:var(--altin);color:#1b1404;border-color:var(--altin);font-weight:700}

  /* 3B etiketler */
  /* etiket yıldızın altından başlar (konumu three.js veriyor, biz sadece boşluk bırakıyoruz) */
  .etiket{font-size:14px;color:var(--yazi);text-shadow:0 0 6px #000,0 0 14px #000;white-space:nowrap;padding-top:18px;
    transition:color .2s;pointer-events:none}
  .etiket.kucuk{font-size:12px;color:var(--soluk);padding-top:12px}
  .etiket.ustte{color:var(--altin)}
  .etiket.kd{font-family:Fraunces,serif;font-size:16px;color:#ffd79a;padding-top:46px}
  .alan-adi{font-family:Fraunces,serif;font-size:clamp(20px,2.6vw,34px);letter-spacing:8px;text-transform:uppercase;
    color:rgba(220,228,255,.22);pointer-events:none;white-space:nowrap}

  /* bilgi kartı */
  .kart{position:fixed;right:20px;top:110px;width:min(360px,calc(100vw - 32px));background:var(--kart);backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:18px 20px;box-shadow:0 20px 60px rgba(0,0,0,.6);
    transform:translateX(calc(100% + 40px));visibility:hidden;transition:transform .4s cubic-bezier(.2,.8,.2,1),visibility .4s;
    z-index:5;max-height:calc(100vh - 220px);overflow:auto}
  .kart.acik{transform:none;visibility:visible}
  .kart .tur{padding-right:24px;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--altin)}
  .kart h2{font-family:Fraunces,serif;font-weight:600;font-size:24px;margin:6px 0 10px}
  .kart p{line-height:1.5;margin:8px 0;font-size:15px}
  .kart .bas{color:var(--soluk);font-size:12px;text-transform:uppercase;letter-spacing:1px;margin-top:14px}
  .kart ul{padding-left:18px;margin:6px 0}
  .kart li{margin:4px 0;line-height:1.4}
  .kart .kapat{position:absolute;right:12px;top:10px;background:none;border:0;color:var(--soluk);font-size:22px;cursor:pointer}
  .kart a{color:var(--altin);cursor:pointer;text-decoration:underline dotted}

  footer{position:fixed;left:0;right:0;bottom:0;padding:26px 16px 14px;z-index:3;
    background:linear-gradient(to top, rgba(4,6,15,.9), rgba(4,6,15,0))}
  footer .baslik{font-size:12px;color:var(--soluk);letter-spacing:2px;text-transform:uppercase;margin-bottom:8px}
  .serit{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
  .cip{flex:none;font:inherit;font-size:13px;padding:6px 11px;border-radius:999px;border:1px solid rgba(255,255,255,.14);cursor:pointer;
    white-space:nowrap;background:rgba(4,6,15,.5);color:var(--yazi);backdrop-filter:blur(6px)}
  .cip.bitti::before{content:"✦ ";color:var(--altin)}
  .cip.bekliyor{color:var(--soluk)}
  .cip.bekliyor::before{content:"○ ";color:var(--bekleyen)}

  .ipucu{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);font-size:13px;color:var(--soluk);background:rgba(0,0,0,.45);
    padding:6px 14px;border-radius:999px;pointer-events:none;transition:opacity 1.2s;z-index:3;white-space:nowrap}
  .hata{position:fixed;inset:0;z-index:30;display:grid;place-items:center;text-align:center;padding:24px;color:var(--soluk)}
  nav button.kilitle{background:none;border-color:rgba(255,255,255,.08);color:var(--soluk)}

  /* kilit ekranı: bulanık gökyüzü üstünde tek alan */
  #kilit{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:24px;background:var(--gece);transition:opacity .6s}
  #kilit[hidden]{display:none}
  #kilit.gitti{opacity:0;pointer-events:none}
  #kilit .gok{position:absolute;inset:-40px;filter:blur(14px);opacity:.9;
    background:
      radial-gradient(circle at 22% 30%, rgba(169,139,255,.35), transparent 38%),
      radial-gradient(circle at 78% 24%, rgba(95,212,255,.28), transparent 36%),
      radial-gradient(circle at 70% 76%, rgba(255,159,122,.24), transparent 40%),
      radial-gradient(circle at 26% 78%, rgba(125,255,178,.22), transparent 36%),
      radial-gradient(1.6px 1.6px at 12% 18%, #fff, transparent), radial-gradient(1.8px 1.8px at 44% 62%, #dfe6ff, transparent),
      radial-gradient(1.4px 1.4px at 61% 14%, #ffe9c4, transparent), radial-gradient(2px 2px at 88% 52%, #fff, transparent),
      radial-gradient(1.4px 1.4px at 34% 90%, #c9d6ff, transparent), radial-gradient(1.8px 1.8px at 92% 88%, #ffd2e8, transparent)}
  #kilit form{position:relative;display:flex;flex-direction:column;gap:12px;width:min(320px,100%);text-align:center}
  #kilit h2{font-family:Fraunces,serif;font-weight:300;font-size:34px;margin:0 0 6px;text-shadow:0 0 24px rgba(244,200,106,.25)}
  #kilit h2 b{font-weight:600;color:var(--altin)}
  #kilit input{font:inherit;font-size:16px;color:var(--yazi);background:rgba(14,20,48,.7);border:1px solid rgba(255,255,255,.2);
    border-radius:12px;padding:12px 14px;text-align:center;backdrop-filter:blur(6px)}
  #kilit input:focus{outline:2px solid var(--altin);outline-offset:1px}
  #kilit button{font:inherit;font-size:15px;font-weight:700;color:#1b1404;background:var(--altin);border:0;border-radius:12px;padding:12px;cursor:pointer}
  #kilit button:disabled{opacity:.6;cursor:wait}
  #kilitHata{min-height:20px;font-size:14px;color:#ff9f9f}
  @media (max-width:640px){
    .kart{top:auto;bottom:0;right:0;left:0;width:100%;border-radius:16px 16px 0 0;transform:translateY(105%);max-height:60vh}
    .kart.acik{transform:none}
    .alt{font-size:12px}
  }
</style>

<body>
<div id="kilit" hidden>
  <div class="gok"></div>
  <form id="kilitForm" autocomplete="off">
    <h2>Kafamın <b>İçi</b></h2>
    <input id="parola" type="password" placeholder="Parola" aria-label="Parola" autocomplete="current-password" required>
    <button type="submit" id="kilitDugme">Aç</button>
    <div id="kilitHata" role="alert"></div>
  </form>
</div>
<div id="sahne"></div>
<div id="etiketler"></div>

<header>
  <div>
    <h1>Kafamın <b>İçi</b></h1>
    <div class="alt" id="altYazi">yıldızlar yaptıklarım · halkalar yapacaklarım · altın ipler göremediğim bağlantılar</div>
  </div>
  <nav id="filtre">
    <button data-f="hepsi" class="secili">Hepsi</button>
    <button data-f="yaptim">✦ Yaptıklarım</button>
    <button data-f="yapacagim">○ Yapacaklarım</button>
    <button data-f="gizli">⟡ Gizli bağlantılar</button>
    <button type="button" id="kilitle" class="kilitle" title="Kilitle">Kilitle</button>
  </nav>
</header>

<aside class="kart" id="kart"><button class="kapat" aria-label="Kapat">×</button><div id="kartIc"></div></aside>
<div class="ipucu" id="ipucu">Sürükle: döndür · kaydır: yaklaş · dokun: aç</div>

<footer>
  <div class="baslik">Bu hafta</div>
  <div class="serit" id="serit"></div>
</footer>

<script>
// Servis çalışanı (sw.js): çevrimdışı açılış. Ayrı betik, çünkü aşağıdaki modül parola beklerken durur.
if ("serviceWorker" in navigator)
  navigator.serviceWorker.register("./sw.js").then(() => navigator.serviceWorker.ready)
    // ilk ziyarette veri henüz servis çalışanından geçmedi: bir kez daha iste ki son kopya saklansın
    .then(() => fetch("veri.sifreli.json", { cache: "no-store" }))
    .catch(() => {});
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
import { CSS2DRenderer, CSS2DObject } from "three/addons/renderers/CSS2DRenderer.js";
import { anahtarTuret, coz, anahtarSakla, anahtarGetir, anahtarSil } from "./kilit.js";

/* ---------------- kilit: şifreli veriyi çek, çöz ---------------- */
const kilitKutu = document.getElementById("kilit");
const kilitHata = document.getElementById("kilitHata");
document.getElementById("kilitForm").onsubmit = e => e.preventDefault(); // parola istenmeden sayfa yenilenmesin

document.getElementById("kilitle").onclick = async () => {
  try { await anahtarSil(); } catch { /* depo yoksa da yenile */ }
  location.reload();
};

function parolaIste(kapsul) {
  return new Promise(coz_ => {
    const form = document.getElementById("kilitForm"), alan = document.getElementById("parola"), dugme = document.getElementById("kilitDugme");
    kilitKutu.hidden = false; alan.focus();
    form.onsubmit = async e => {
      e.preventDefault();
      if (!alan.value) return;
      dugme.disabled = true; kilitHata.textContent = "";
      try {
        const anahtar = await anahtarTuret(alan.value, kapsul.salt);
        const veri = await coz(kapsul, anahtar);
        try { await anahtarSakla(anahtar); } catch { /* saklanamazsa her açılışta parola sorulur */ }
        alan.value = "";
        coz_(veri);
      } catch {
        kilitHata.textContent = "Parola tutmadı";
        alan.select();
      } finally { dugme.disabled = false; }
    };
  });
}

async function veriAl() {
  let kapsul;
  try {
    const r = await fetch("veri.sifreli.json", { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    kapsul = await r.json();
  } catch {
    document.body.insertAdjacentHTML("beforeend", `<div class="hata">Veri dosyası okunamadı. Sayfayı bir sunucudan açın ya da biraz sonra yeniden deneyin.</div>`);
    throw new Error("veri yok");
  }
  let saklı = null;
  try { saklı = await anahtarGetir(); } catch { /* depo kullanılamıyor: parola sor */ }
  if (saklı) {
    try { return await coz(kapsul, saklı); }
    catch { try { await anahtarSil(); } catch { /* yok say */ } } // salt değişmiş olabilir
  }
  return parolaIste(kapsul);
}

const VERI = await veriAl();
kilitKutu.classList.add("gitti");
setTimeout(() => kilitKutu.remove(), 700);
document.getElementById("altYazi").textContent = VERI.tarih + " · yıldızlar yaptıklarım · halkalar yapacaklarım · altın ipler göremediğim bağlantılar";

const azHareket = matchMedia("(prefers-reduced-motion: reduce)").matches;
const dar = innerWidth < 700;

/* ---------------- sahne, kamera, ışık efekti (bloom) ---------------- */
const kutu = document.getElementById("sahne");
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, dar ? 1.5 : 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
kutu.appendChild(renderer.domElement);

const etiketCizer = new CSS2DRenderer({ element: document.getElementById("etiketler") });
etiketCizer.setSize(innerWidth, innerHeight);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x04060f);
scene.fog = new THREE.FogExp2(0x04060f, 0.0016);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 4000);
// Ekran ne kadar dar/uzunsa o kadar geriden bak ki her şey sığsın
const GENEL_POZ = new THREE.Vector3(0, 10, dar ? 205 : Math.min(300, 135 * Math.max(1, 1.6 / (innerWidth / innerHeight))));
camera.position.set(0, 120, 520);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = !azHareket;
controls.autoRotateSpeed = 0.3;
controls.minDistance = 20;
controls.maxDistance = 420;
controls.enablePan = false;

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.85, 0.55, 0.15);
composer.addPass(bloom);
composer.addPass(new OutputPass());

/* ---------------- kodla çizilen dokular (resim dosyası yok) ---------------- */
function tuval(boyut, ciz) {
  const c = document.createElement("canvas"); c.width = c.height = boyut;
  ciz(c.getContext("2d"), boyut);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const PARILTI = tuval(128, (g, s) => {
  const r = g.createRadialGradient(s/2, s/2, 0, s/2, s/2, s/2);
  r.addColorStop(0, "rgba(255,255,255,1)"); r.addColorStop(.15, "rgba(255,255,255,.75)");
  r.addColorStop(.4, "rgba(255,255,255,.18)"); r.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = r; g.fillRect(0, 0, s, s);
});
const ISIK_HACI = tuval(256, (g, s) => { // dört kollu yıldız parıltısı
  g.translate(s/2, s/2);
  for (const aci of [0, Math.PI/2]) {
    g.save(); g.rotate(aci); g.scale(1, .045);
    const r = g.createRadialGradient(0, 0, 0, 0, 0, s/2);
    r.addColorStop(0, "rgba(255,255,255,1)"); r.addColorStop(.5, "rgba(255,255,255,.25)"); r.addColorStop(1, "rgba(255,255,255,0)");
    g.fillStyle = r; g.beginPath(); g.arc(0, 0, s/2, 0, Math.PI*2); g.fill(); g.restore();
  }
});
const HALKA = tuval(128, (g, s) => {
  g.strokeStyle = "rgba(255,255,255,1)"; g.lineWidth = s * .06; g.shadowColor = "#fff"; g.shadowBlur = s * .12;
  g.beginPath(); g.arc(s/2, s/2, s * .3, 0, Math.PI*2); g.stroke();
});
const DISK = tuval(512, (g, s) => { // kara deliğin etrafındaki dönen ışık diski
  const r = g.createRadialGradient(s/2, s/2, s*.1, s/2, s/2, s/2);
  r.addColorStop(0, "rgba(0,0,0,0)"); r.addColorStop(.22, "rgba(0,0,0,0)"); r.addColorStop(.27, "rgba(255,236,190,.9)");
  r.addColorStop(.38, "rgba(255,160,70,.55)"); r.addColorStop(.65, "rgba(190,60,50,.18)"); r.addColorStop(1, "rgba(120,30,60,0)");
  g.fillStyle = r; g.fillRect(0, 0, s, s);
  g.globalCompositeOperation = "lighter";
  for (let i = 0; i < 140; i++) { // dönerken görünen çizgiler
    const rr = s * (.12 + Math.random() * .34), a = Math.random() * Math.PI * 2;
    g.strokeStyle = `rgba(255,${180 + Math.random()*60|0},120,${Math.random()*.25})`;
    g.lineWidth = 1 + Math.random() * 2.5;
    g.beginPath(); g.arc(s/2, s/2, rr, a, a + .3 + Math.random() * 1.2); g.stroke();
  }
});

const isikMat = (doku, renk, opaklik = 1) => new THREE.SpriteMaterial({
  map: doku, color: renk, transparent: true, opacity: opaklik, blending: THREE.AdditiveBlending, depthWrite: false });

/* ---------------- yıldız tozu: binlerce titreyen yıldız + galaksi kuşağı ---------------- */
let tohum = 16112026;
const rnd = () => (tohum = (tohum * 9301 + 49297) % 233280) / 233280;

const yildizMat = new THREE.ShaderMaterial({
  uniforms: { uZaman: { value: 0 } },
  vertexShader: `
    attribute float boy; attribute float faz; attribute vec3 renk;
    uniform float uZaman; varying vec3 vRenk; varying float vParlak;
    void main(){
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = boy * (300.0 / -mv.z);
      vParlak = 0.5 + 0.5 * sin(uZaman * (0.5 + faz) + faz * 6.2831);
      vRenk = renk; gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: `
    varying vec3 vRenk; varying float vParlak;
    void main(){
      float d = length(gl_PointCoord - 0.5);
      float a = 1.0 - smoothstep(0.0, 0.5, d);
      a *= a;
      gl_FragColor = vec4(vRenk * (0.6 + vParlak), a * (0.35 + 0.65 * vParlak));
    }`,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
});
function yildizBulutu(sayi, konum) {
  const p = new Float32Array(sayi*3), b = new Float32Array(sayi), f = new Float32Array(sayi), c = new Float32Array(sayi*3);
  const renk = new THREE.Color();
  for (let i = 0; i < sayi; i++) {
    const [x, y, z, boy, r] = konum(i);
    p.set([x, y, z], i*3); b[i] = boy; f[i] = rnd();
    renk.set(r); c.set([renk.r, renk.g, renk.b], i*3);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.BufferAttribute(p, 3));
  geo.setAttribute("boy", new THREE.BufferAttribute(b, 1));
  geo.setAttribute("faz", new THREE.BufferAttribute(f, 1));
  geo.setAttribute("renk", new THREE.BufferAttribute(c, 3));
  const pts = new THREE.Points(geo, yildizMat); scene.add(pts); return pts;
}
const RENKLER = ["#ffffff", "#dfe6ff", "#ffe9c4", "#c9d6ff", "#ffd2e8"];
// uzak gök küresi
yildizBulutu(dar ? 1800 : 3500, () => {
  const u = rnd()*2-1, t = rnd()*Math.PI*2, r = 350 + rnd()*900, s = Math.sqrt(1-u*u);
  return [r*s*Math.cos(t), r*u, r*s*Math.sin(t), 1.2 + rnd()*2.8, RENKLER[rnd()*RENKLER.length|0]];
});
// yamuk duran galaksi kuşağı
const kusak = yildizBulutu(dar ? 2500 : 6000, () => {
  const t = rnd()*Math.PI*2, r = 180 + Math.pow(rnd(), .6) * 520, kalinlik = (rnd()-.5) * (30 + r*.08);
  const renk = rnd() < .5 ? "#9fb4ff" : rnd() < .6 ? "#d6a8ff" : "#ffc7a8";
  return [Math.cos(t)*r, kalinlik, Math.sin(t)*r, .8 + rnd()*1.8, renk];
});
kusak.rotation.set(.45, 0, .32);

/* ---------------- veriyi 3B konuma çevir ---------------- */
const ozet = s => [...s].reduce((h, ch) => (h * 31 + ch.charCodeAt(0)) >>> 0, 7);
// Telefonda ekran uzun olduğu için haritayı 90° çevirip dik yerleştir
const konum3 = (x, y, z) => dar
  ? new THREE.Vector3((y - 500) / 8.5, -(x - 800) / 8.5, z)
  : new THREE.Vector3((x - 800) / 8.5, -(y - 500) / 8.5, z);
const bul = id => DUGUMLER.find(d => d.id === id);
const esc = m => String(m ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

// Alan bulutsuları ve adları
for (const a of VERI.alanlar) {
  const merkez = konum3(a.x, a.y + (a.y < 500 ? 150 : -150), a.z);
  const bulut = new THREE.Sprite(isikMat(PARILTI, a.renk, .13)); bulut.scale.setScalar(dar ? 70 : 90); bulut.position.copy(merkez);
  scene.add(bulut);
  const div = document.createElement("div"); div.className = "alan-adi"; div.textContent = a.ad;
  const lbl = new CSS2DObject(div); lbl.position.copy(konum3(a.x, a.y, a.z)); scene.add(lbl);
}

/* ---------------- düğümler ---------------- */
const DUGUMLER = VERI.dugumler.map(d => ({ ...d }));
const tiklananlar = []; // ışın (ray) ile seçilecek görünmez küreler ve tüpler
const kdParcalar = [];  // kara deliğe düşen parçacıklar
let kdDisk = null;

for (const d of DUGUMLER) {
  d.poz = konum3(d.x, d.y, d.z);
  const g = new THREE.Group(); g.position.copy(d.poz); scene.add(g);
  d.grup = g; d.matlar = []; d.dim = 1; d.dimHedef = 1; d.faz = (ozet(d.id) % 100) / 100 * Math.PI * 2;
  const ekle = (mat, olcek, ad) => { const s = new THREE.Sprite(mat); s.scale.setScalar(olcek); g.add(s); d.matlar.push({ m: mat, taban: mat.opacity * (d.unutulmus ? .5 : 1) }); if (ad) d[ad] = s; return s; };
  let vurusYaricap = 2.4, etiketSinif = "etiket";

  if (d.tur === "karadelik") {
    const kure = new THREE.Mesh(new THREE.SphereGeometry(2.6, 32, 32), new THREE.MeshBasicMaterial({ color: 0x000000 }));
    g.add(kure);
    const egik = new THREE.Group(); egik.rotation.set(-1.15, .25, 0); g.add(egik);
    const diskMat = new THREE.MeshBasicMaterial({ map: DISK, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide, opacity: .6 });
    kdDisk = new THREE.Mesh(new THREE.PlaneGeometry(22, 22), diskMat); egik.add(kdDisk);
    d.matlar.push({ m: diskMat, taban: .6 });
    const fotonMat = new THREE.MeshBasicMaterial({ color: 0xffe2a8, transparent: true, opacity: .9 });
    const foton = new THREE.Mesh(new THREE.TorusGeometry(2.95, .09, 12, 96), fotonMat); g.add(foton); d.foton = foton;
    d.matlar.push({ m: fotonMat, taban: .9 });
    // içeri doğru sarmal çizen parçacıklar
    const n = 260, poz = new Float32Array(n * 3);
    for (let i = 0; i < n; i++) kdParcalar.push({ r: 3 + rnd() * 9, a: rnd() * Math.PI * 2 });
    const pGeo = new THREE.BufferGeometry(); pGeo.setAttribute("position", new THREE.BufferAttribute(poz, 3));
    const pMat = new THREE.PointsMaterial({ map: PARILTI, color: 0xffc27a, size: .4, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending });
    const pts = new THREE.Points(pGeo, pMat); egik.add(pts); d.kdNoktalar = pts; d.matlar.push({ m: pMat, taban: 1 });
    vurusYaricap = 6; etiketSinif = "etiket kd";
  } else if (d.tur === "fikir") {
    ekle(isikMat(PARILTI, "#e48bd0", .55), 26);
    ekle(isikMat(PARILTI, "#7a5cd6", .45), 34).position.set(4, -2, -2);
    ekle(isikMat(PARILTI, "#ffd6f4", 1), 3);
    vurusYaricap = 5;
  } else if (d.durum === "bekliyor") {
    ekle(isikMat(HALKA, "#8fa2ff", .95), 5.5, "halka");
    ekle(isikMat(PARILTI, "#8fa2ff", .5), 2.2);
    etiketSinif = "etiket kucuk";
  } else {
    const renk = d.tur === "ders" ? "#a9c1ff" : d.tur === "kaynak" ? "#7ff0e0" : d.durum === "surekli" ? "#cfe0ff" : "#ffe7b0";
    const buyuk = d.tur === "proje";
    ekle(isikMat(PARILTI, renk, buyuk ? .9 : .7), buyuk ? 11 : 6);
    if (buyuk || d.tur === "kaynak") ekle(isikMat(ISIK_HACI, renk, d.durum === "bitti" ? 1 : .55), buyuk ? 18 : 10, "haci");
    ekle(isikMat(PARILTI, "#ffffff", 1), buyuk ? 2.6 : 1.6);
    if (!buyuk) etiketSinif = "etiket kucuk";
  }

  const vurus = new THREE.Mesh(new THREE.SphereGeometry(vurusYaricap, 8, 8), new THREE.MeshBasicMaterial());
  vurus.visible = false; vurus.userData = { tip: "dugum", id: d.id }; g.add(vurus); tiklananlar.push(vurus);

  const div = document.createElement("div"); div.className = etiketSinif; div.textContent = d.ad;
  d.etiket = div;
  const etiket = new CSS2DObject(div); etiket.center.set(.5, 0); // üst kenarı yıldıza değsin, yazı aşağı sarksın
  g.add(etiket);
}

/* ---------------- benim kurduğum bağlantılar: ince çizgiler ---------------- */
const ACIK = VERI.acik.filter(([a, b]) => bul(a) && bul(b)).map(([a, b]) => {
  const mat = new THREE.LineBasicMaterial({ color: 0xaab6ff, transparent: true, opacity: .2, blending: THREE.AdditiveBlending, depthWrite: false });
  const geo = new THREE.BufferGeometry().setFromPoints([bul(a).poz, bul(b).poz]);
  scene.add(new THREE.Line(geo, mat));
  return { a, b, mat, taban: .2, dim: 1, dimHedef: 1 };
});

/* ---------------- göremediğim bağlantılar: içinde ışık akan altın ipler ---------------- */
const GIZLI = VERI.gizli.filter(g => bul(g.a) && bul(g.b)).map((g, i) => {
  const A = bul(g.a).poz, B = bul(g.b).poz;
  const orta = A.clone().add(B).multiplyScalar(.5);
  const yon = B.clone().sub(A); const uz = yon.length();
  const dik = new THREE.Vector3(-yon.y, yon.x, 0).normalize().multiplyScalar((i % 2 ? 1 : -1) * Math.min(14, uz * .22));
  orta.add(dik).add(new THREE.Vector3(0, 0, 8 + (i % 3) * 4));
  const egri = new THREE.QuadraticBezierCurve3(A, orta, B);
  const taban = g.guven === "tahmin" ? .22 : .4; // tahmin edilen ip daha soluk
  const mat = new THREE.MeshBasicMaterial({ color: 0xf4c86a, transparent: true, opacity: taban, blending: THREE.AdditiveBlending, depthWrite: false });
  scene.add(new THREE.Mesh(new THREE.TubeGeometry(egri, 60, .07, 6), mat));
  const vurus = new THREE.Mesh(new THREE.TubeGeometry(egri, 24, 1.3, 6), new THREE.MeshBasicMaterial());
  vurus.visible = false; vurus.userData = { tip: "ip", i }; scene.add(vurus); tiklananlar.push(vurus);
  const akis = [];
  for (let k = 0; k < 5; k++) {
    const m = isikMat(PARILTI, "#ffd88a", .9); const s = new THREE.Sprite(m); s.scale.setScalar(1.7); scene.add(s);
    akis.push({ s, m, ofset: k / 5 });
  }
  return { ...g, egri, mat, taban, akis, dim: 1, dimHedef: 1, guc: 1, gucHedef: 1, hiz: .05 + (i % 4) * .012 };
});

/* ---------------- vurgulama ve filtreler ---------------- */
const SOLUK = .07;
let odak = false; // bir şeye odaklanınca telefonda küçük etiketler de görünür
function hepsiniAc() {
  odak = false;
  DUGUMLER.forEach(d => d.dimHedef = 1);
  ACIK.forEach(l => l.dimHedef = 1);
  GIZLI.forEach(g => { g.dimHedef = 1; g.gucHedef = 1; });
}
function sadece(idler, ipler) {
  odak = true;
  DUGUMLER.forEach(d => d.dimHedef = idler.has(d.id) ? 1 : SOLUK);
  ACIK.forEach(l => l.dimHedef = idler.has(l.a) && idler.has(l.b) ? 1 : SOLUK);
  GIZLI.forEach((g, i) => { const bu = ipler.includes(i); g.dimHedef = bu ? 1 : SOLUK * .6; g.gucHedef = bu ? 2.2 : 1; });
}
let seciliFiltre = "hepsi";
function filtreUygula(f) {
  seciliFiltre = f;
  document.querySelectorAll("#filtre button[data-f]").forEach(b => b.classList.toggle("secili", b.dataset.f === f));
  if (f === "hepsi") return hepsiniAc();
  if (f === "gizli") return sadece(new Set(GIZLI.flatMap(g => [g.a, g.b])), GIZLI.map((_, i) => i));
  const istenen = f === "yaptim" ? "bitti" : "bekliyor";
  sadece(new Set(DUGUMLER.filter(d => d.durum === istenen).map(d => d.id)), []);
}
document.querySelectorAll("#filtre button[data-f]").forEach(b => b.onclick = () => { kartiKapat(false); filtreUygula(b.dataset.f); });

/* ---------------- kamera uçuşu ---------------- */
let ucus = null;
function uc(hedefNokta, hedefPoz, sure = 1.4) {
  ucus = { t: 0, sure, p0: camera.position.clone(), p1: hedefPoz, h0: controls.target.clone(), h1: hedefNokta.clone() };
}
const yumusak = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
function yakinlas(nokta, uzaklik = dar ? 46 : 36) {
  const yon = camera.position.clone().sub(controls.target).normalize();
  uc(nokta, nokta.clone().add(yon.multiplyScalar(uzaklik)));
}

/* ---------------- bilgi kartı ---------------- */
const kart = document.getElementById("kart"), kartIc = document.getElementById("kartIc");
const TUR_ADI = { proje: "Proje", gorev: "Yapılacak", ders: "Ders", kaynak: "Kaynak", fikir: "Fikir · tohum", karadelik: "Desen · Claude'un fark ettiği" };
const DURUM_ADI = { bitti: "✦ bu hafta ilerledi", bekliyor: "○ bekliyor", surekli: "süregiden" };

function dugumGoster(id) {
  const d = bul(id);
  const baglar = GIZLI.map((g, i) => ({ ...g, i })).filter(g => g.a === id || g.b === id);
  kartIc.innerHTML = `
    <div class="tur">${esc(TUR_ADI[d.tur])} · ${esc(DURUM_ADI[d.durum])}</div>
    <h2>${esc(d.ad)}</h2><p>${esc(d.metin ?? "")}</p>
    ${d.unutulmus ? `<p class="bas">${esc(d.bekliyorGun)} gündür bekliyor</p>` : ""}
    ${d.sonraki ? `<div class="bas">Sonraki adım</div><p>${esc(d.sonraki)}</p>` : ""}
    ${baglar.length ? `<div class="bas">⟡ Göremediğin bağlantılar</div><ul>${
      baglar.map(g => `<li><a data-gizli="${g.i}">${esc(g.baslik)}</a>${g.guven === "tahmin" ? " <em>(tahmin)</em>" : ""} → ${esc(bul(g.a === id ? g.b : g.a).ad)}</li>`).join("")}</ul>` : ""}`;
  kartIc.querySelectorAll("[data-gizli]").forEach(a => a.onclick = () => gizliGoster(+a.dataset.gizli));
  sadece(new Set([id, ...baglar.flatMap(g => [g.a, g.b])]), baglar.map(g => g.i));
  controls.autoRotate = false; yakinlas(d.poz);
  kart.classList.add("acik");
}
function gizliGoster(i) {
  const g = GIZLI[i];
  kartIc.innerHTML = `
    <div class="tur">⟡ Göremediğin bağlantı${g.guven === "tahmin" ? " · tahmin" : ""}</div>
    <h2>${esc(g.baslik)}</h2>
    <p><a data-id="${esc(g.a)}">${esc(bul(g.a).ad)}</a> ⟷ <a data-id="${esc(g.b)}">${esc(bul(g.b).ad)}</a></p>
    ${g.metin ? `<p>${esc(g.metin)}</p>` : ""}`;
  kartIc.querySelectorAll("[data-id]").forEach(a => a.onclick = () => dugumGoster(a.dataset.id));
  sadece(new Set([g.a, g.b]), [i]);
  controls.autoRotate = false; yakinlas(g.egri.getPoint(.5), dar ? 70 : 55);
  kart.classList.add("acik");
}
function kartiKapat(geriDon = true) {
  if (!kart.classList.contains("acik")) return;
  kart.classList.remove("acik");
  filtreUygula(seciliFiltre);
  if (geriDon) uc(new THREE.Vector3(), GENEL_POZ.clone(), 1.6);
  controls.autoRotate = !azHareket;
}
kart.querySelector(".kapat").onclick = () => kartiKapat();
addEventListener("keydown", e => { if (e.key === "Escape") kartiKapat(); });

/* ---------------- tıklama / üzerine gelme ---------------- */
const isin = new THREE.Raycaster(), fare = new THREE.Vector2();
function vur(e) {
  fare.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  isin.setFromCamera(fare, camera);
  const hepsi = isin.intersectObjects(tiklananlar, false);
  return hepsi.find(h => h.object.userData.tip === "dugum") || hepsi[0];
}
let basla = null, ustteki = null;
renderer.domElement.addEventListener("pointerdown", e => { basla = [e.clientX, e.clientY]; ucus = null; });
renderer.domElement.addEventListener("click", e => {
  if (basla && Math.hypot(e.clientX - basla[0], e.clientY - basla[1]) > 6) return; // sürüklemeyse tıklama sayma
  const h = vur(e);
  if (!h) return kartiKapat();
  h.object.userData.tip === "dugum" ? dugumGoster(h.object.userData.id) : gizliGoster(h.object.userData.i);
});
renderer.domElement.addEventListener("pointermove", e => {
  if (e.pointerType !== "mouse") return;
  const h = vur(e), id = h && h.object.userData.tip === "dugum" ? h.object.userData.id : null;
  if (ustteki && ustteki !== id) bul(ustteki).etiket.classList.remove("ustte");
  if (id) bul(id).etiket.classList.add("ustte");
  ustteki = id;
  renderer.domElement.style.cursor = h ? "pointer" : "grab";
});

/* ---------------- bu hafta şeridi ---------------- */
const serit = document.getElementById("serit");
for (const id of VERI.buHafta) {
  const d = bul(id); if (!d) continue;
  const c = document.createElement("button");
  c.className = "cip " + (d.durum === "bitti" ? "bitti" : "bekliyor");
  c.textContent = d.ad; c.onclick = () => dugumGoster(id);
  serit.appendChild(c);
}

/* ---------------- canlandırma döngüsü ---------------- */
const saat = new THREE.Clock();
const kdPoz = DUGUMLER.find(d => d.kdNoktalar)?.kdNoktalar.geometry.attributes.position;
uc(new THREE.Vector3(), GENEL_POZ.clone(), 3.2); // açılışta uzaktan süzülerek gel

function dongu() {
  const ham = saat.getDelta(); // gerçek geçen süre: kamera uçuşu yavaş cihazda da zamanında bitsin
  const dt = Math.min(ham, .05), t = saat.elapsedTime, yavas = azHareket ? .3 : 1;
  yildizMat.uniforms.uZaman.value = t;
  kusak.rotation.y += dt * .004 * yavas;

  for (const d of DUGUMLER) {
    d.dim += (d.dimHedef - d.dim) * Math.min(1, dt * 5);
    let nabiz = 1;
    if (d.halka) { // yapılacaklar nefes alır
      const hiz = d.unutulmus ? 1.1 : 2.2; // unutulmuşlar yarı hızda nefes alır
      const s = 1 + .14 * Math.sin(t * hiz + d.faz);
      d.halka.scale.setScalar(5.5 * s); nabiz = .65 + .35 * Math.sin(t * hiz + d.faz);
    }
    if (d.haci) d.haci.material.rotation = Math.sin(t * .4 + d.faz) * .25;
    d.matlar.forEach((x, k) => x.m.opacity = x.taban * d.dim * (k === 0 ? nabiz : 1));
    const kucukGizli = dar && !odak && d.etiket.classList.contains("kucuk");
    d.etiket.style.opacity = kucukGizli ? 0 : d.dim < .5 ? d.dim * 1.4 : 1;
  }
  if (kdDisk) kdDisk.rotation.z -= dt * .35 * yavas;
  if (kdPoz) {
    kdParcalar.forEach((p, i) => {
      p.a += dt * (5 / p.r) * yavas; p.r -= dt * (.6 + 2.4 / p.r) * yavas;
      if (p.r < 2.7) { p.r = 9 + rnd() * 4; p.a = rnd() * Math.PI * 2; }
      kdPoz.setXYZ(i, Math.cos(p.a) * p.r, Math.sin(p.a) * p.r, (rnd() - .5) * .15);
    });
    kdPoz.needsUpdate = true;
  }
  for (const l of ACIK) { l.dim += (l.dimHedef - l.dim) * Math.min(1, dt * 5); l.mat.opacity = l.taban * l.dim; }
  for (const g of GIZLI) {
    g.dim += (g.dimHedef - g.dim) * Math.min(1, dt * 5);
    g.guc += (g.gucHedef - g.guc) * Math.min(1, dt * 5);
    g.mat.opacity = Math.min(1, g.taban * g.dim * g.guc);
    for (const a of g.akis) {
      const u = (t * g.hiz * yavas + a.ofset) % 1;
      a.s.position.copy(g.egri.getPointAt(u));
      a.m.opacity = .9 * g.dim * Math.sin(u * Math.PI);
      a.s.scale.setScalar(1.7 * (g.guc > 1.2 ? 1.4 : 1));
    }
  }

  if (ucus) {
    ucus.t += Math.min(ham, .5) / ucus.sure; const k = yumusak(Math.min(1, ucus.t));
    camera.position.lerpVectors(ucus.p0, ucus.p1, k);
    controls.target.lerpVectors(ucus.h0, ucus.h1, k);
    if (ucus.t >= 1) ucus = null;
  }
  controls.update();
  composer.render();
  etiketCizer.render(scene, camera);
  requestAnimationFrame(dongu);
}
dongu();

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
  bloom.setSize(innerWidth, innerHeight); etiketCizer.setSize(innerWidth, innerHeight);
});
if (matchMedia("(pointer: coarse)").matches)
  document.getElementById("ipucu").textContent = "Sürükle: döndür · iki parmak: yaklaş · dokun: aç";
setTimeout(() => document.getElementById("ipucu").style.opacity = 0, 6000);

</script>
</body>
</html>
